<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk 2077 - Garage</title>
    <link rel="stylesheet" href="static/css/index.css">
</head>

<body data-page="home">

<!-- HEADER -->
<header>
    <div>
        <h1>CyberPunk 2077</h1>
    </div>

    <nav class="header-nav">
        <a href="index.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="about.html">A Propos</a>
    </nav>
    <div class="header-actions">
        <a class="icon-button" href="catalogue.html" aria-label="Rechercher">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M20 20l-4.2-4.2"></path>
            </svg>
        </a>
        <button class="icon-button theme-toggle" type="button" aria-label="Changer le theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v18"></path>
                <path d="M12 3a9 9 0 1 0 0 18"></path>
            </svg>
        </button>
        <a class="icon-button cart-link" href="cart.html" aria-label="Panier">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="19" r="1.5"></circle>
                <circle cx="17" cy="19" r="1.5"></circle>
                <path d="M3 5h2l2.3 9h9.7l2-7H7.3"></path>
            </svg>
            <span class="cart-count" data-cart-count>0</span>
        </a>
    </div>
</header>

<!-- HERO -->
<section>
    <div class="space bar"></div>
    <p>// MARCHÉ SOUTERRAIN</p>

    <div>
        <h3>la boutique de <span>Vehicules</span></h3>
    </div>

    <div>
        <h3>de Cyberpunk</h3>
    </div>

    <p>
        Armes légendaires, implants de combat, artefacts de l'ère perdue.
        Tout ce dont vous avez besoin pour survivre dans les méga-cités du futur.
    </p>
</section>

<!-- SEARCH + FILTERS -->
<section class="filters-section">
    <div class="search-shell">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M20 20l-4.2-4.2"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Rechercher un vehicule, un constructeur, une couleur">
    </div>

    <div class="filter-bar">
        <div class="filter-summary">
            <span class="filter-label">Filtre actif</span>
            <strong id="activeFilterLabel">Tous les constructeurs</strong>
        </div>
        <div class="filter-pills" id="brandFilters">
            <button class="filter-pill active" type="button" data-brand="Tous">Tous</button>
            <button class="filter-pill" type="button" data-brand="Arch">Arch</button>
            <button class="filter-pill" type="button" data-brand="Brennan">Brennan</button>
            <button class="filter-pill" type="button" data-brand="Yaiba">Yaiba</button>
            <button class="filter-pill" type="button" data-brand="Archer">Archer</button>
            <button class="filter-pill" type="button" data-brand="Chevillon">Chevillon</button>
            <button class="filter-pill" type="button" data-brand="Herrera">Herrera</button>
            <button class="filter-pill" type="button" data-brand="Mahir">Mahir</button>
            <button class="filter-pill" type="button" data-brand="Makigai">Makigai</button>
            <button class="filter-pill" type="button" data-brand="Militech">Militech</button>
            <button class="filter-pill" type="button" data-brand="Mizutani">Mizutani</button>
            <button class="filter-pill" type="button" data-brand="Porsche">Porsche</button>
            <button class="filter-pill" type="button" data-brand="Quadra">Quadra</button>
            <button class="filter-pill" type="button" data-brand="Rayfield">Rayfield</button>
            <button class="filter-pill" type="button" data-brand="Thorton">Thorton</button>
            <button class="filter-pill" type="button" data-brand="Villefort">Villefort</button>
        </div>
    </div>
</section>

<!-- GRID DYNAMIQUE -->
<div class="container">

    <p class="results">OBJETS TROUVÉS</p>

    <div class="grid" id="carGrid"></div>

</div>

<!-- SCRIPT -->
<script src="js/shared.js"></script>
<script src="js/main.js"></script>

</body>
</html>
